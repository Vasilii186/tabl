<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>График смен ПВЗ</title></head><body>


<style>
/* Layout: шапка с месяцем -> вкладки пунктов -> панель кистей -> сетка сотрудники x дни -> таблица расчёта зарплаты */
:root{
  --bg:#f1f3f8; --surface:#ffffff; --surface-2:#f6f7fb; --line:#dfe3ec; --line-strong:#c4cbda;
  --fg:#131822; --muted:#566074; --faint:#8791a4; --hover:#e9eefb;
  --ozon:#0b5cff; --wb:#b0189b; --help:#d48600; --help-bg:#fff0cc; --on-brand:#ffffff; --on-help:#3a2700;
  --weekend:#eef0f6; --ok:#1c8a4b; --warn:#b45309; --danger:#c2362c;
  --brand:var(--ozon);
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1118; --surface:#161b25; --surface-2:#1b212d; --line:#272f3d; --line-strong:#38425a;
    --fg:#e8ebf2; --muted:#9aa4b8; --faint:#6c768b; --hover:#212a3f;
    --ozon:#5b95ff; --wb:#e56ad0; --help:#f0b232; --help-bg:#3a2e0f; --on-brand:#0a0f1d; --on-help:#ffe6a8;
    --weekend:#1a2030; --ok:#4cc27f; --warn:#f0a04b; --danger:#ff7b70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1118; --surface:#161b25; --surface-2:#1b212d; --line:#272f3d; --line-strong:#38425a;
  --fg:#e8ebf2; --muted:#9aa4b8; --faint:#6c768b; --hover:#212a3f;
  --ozon:#5b95ff; --wb:#e56ad0; --help:#f0b232; --help-bg:#3a2e0f; --on-brand:#0a0f1d; --on-help:#ffe6a8;
  --weekend:#1a2030; --ok:#4cc27f; --warn:#f0a04b; --danger:#ff7b70;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.b-ozon{--brand:var(--ozon)} .b-wb{--brand:var(--wb)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between}
.ident h1{font-family:var(--font-display);font-size:26px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.ident p{margin:2px 0 0;color:var(--muted)}
.monthnav{display:flex;align-items:center;gap:6px}
.mlabel{font-family:var(--font-display);font-weight:600;font-size:18px;min-width:150px;text-align:center}
button.icon{width:36px;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-size:20px;line-height:1}
button.icon:hover,button.ghost:hover{background:var(--hover)}
button.ghost{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:transparent;margin-left:4px}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button.primary{height:36px;padding:0 16px;border-radius:8px;border:0;background:var(--fg);color:var(--bg);font-weight:600}
button.primary:hover{opacity:.88}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.saved::before{background:var(--ok)} .status.saving::before{background:var(--help)}
.status.error::before,.status.offline::before{background:var(--danger)}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border:0;background:transparent;color:var(--muted);
  border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--brand);font-weight:600}
.tab .dot{width:9px;height:9px;border-radius:3px;background:var(--brand)}
.tab.plain .dot{display:none}

/* panel */
.panel{display:flex;flex-direction:column;gap:14px}
.summary{display:flex;flex-wrap:wrap;gap:12px}
.stat{display:flex;flex-direction:column;min-width:130px;padding:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.stat .sl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.stat .sv{font-family:var(--font-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat.strong{border-color:var(--brand)}
.stat.strong .sv{color:var(--brand)}

.brush{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.bb{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface)}
.bb:hover{background:var(--hover)}
.bb.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);font-weight:600}
.sw{display:inline-block;width:16px;height:16px;border-radius:4px}
.sw.s{background:var(--brand)} .sw.h{background:var(--help-bg);box-shadow:inset 0 0 0 1.5px var(--help)}
.sw.e{border:1.5px dashed var(--faint)}
.helpgrp{display:flex;align-items:center;gap:6px}
.helpgrp input{width:68px;height:38px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);padding:0 8px;text-align:center;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:0}

.grid-wrap,.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.grid{border-collapse:separate;border-spacing:0;font-size:12px}
.grid th,.grid td{height:40px;padding:0;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.grid thead th{height:46px;background:var(--surface-2);font-weight:500;color:var(--muted)}
.grid .name{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;min-width:168px;max-width:200px;border-right:2px solid var(--line-strong)}
.grid thead .name{background:var(--surface-2);padding-left:12px;z-index:3}
.grid tfoot th,.grid tfoot td{background:var(--surface-2);height:34px;color:var(--muted);border-bottom:0}
.grid tfoot .name{background:var(--surface-2);padding-left:12px;font-weight:500}
.grid tbody tr:last-child th,.grid tbody tr:last-child td{border-bottom:1px solid var(--line)}
.day{min-width:34px;width:34px}
.day .dn{display:block;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.day .dw{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.day.wk{background:var(--weekend)!important}
.day.today{box-shadow:inset 0 -3px 0 var(--brand)}
.day.today .dn{color:var(--brand)}
input.nm{width:100%;height:100%;border:0;background:transparent;padding:0 12px;font-weight:600;border-radius:0}
input.nm:hover{background:var(--hover)}
input.nm:focus-visible{outline-offset:-2px}
td.cell{min-width:34px;width:34px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;
  user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}
td.cell.wk{background:var(--weekend)}
td.cell:hover{background:var(--hover)}
td.cell.s{background:var(--brand);color:var(--on-brand)}
td.cell.s:hover{filter:brightness(1.12)}
td.cell.h{background:var(--help-bg);color:var(--on-help);box-shadow:inset 0 0 0 1.5px var(--help);font-size:11px}
td.cell.today:not(.s):not(.h){box-shadow:inset 1px 0 0 var(--brand),inset -1px 0 0 var(--brand)}
td.cell:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.ro td.cell{cursor:default}
.bcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.bcard h3{justify-content:space-between;flex-wrap:wrap}.bcard .bsum{font-weight:500;font-size:13px;color:var(--muted)}.bcard .bsum b{color:var(--fg);font-size:15px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fld2{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld2 input,.fld2 select{height:38px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);padding:0 8px;color:var(--fg);font-size:14px;min-width:0;width:100%}
.bchecks{display:flex;flex-direction:column;gap:6px}.bchecks .chk{align-items:flex-start}.bchecks .chk input{margin-top:1px;flex:none}.muted{color:var(--faint)}
td.cell.wo{background-image:linear-gradient(225deg,var(--danger) 0 9px,transparent 9px);box-shadow:inset 0 0 0 2px var(--danger)}
td.cell.ww{background-image:linear-gradient(225deg,var(--ok) 0 9px,transparent 9px);box-shadow:inset 0 0 0 2px var(--ok)}
td.cell.wo.clash{box-shadow:inset 0 0 0 3px var(--danger),0 0 0 1px var(--danger);position:relative;z-index:1}
.sw.wo{background:var(--surface);box-shadow:inset 0 0 0 2px var(--danger)} .sw.ww{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ok)}
.wishcard textarea{width:100%;font:inherit;background:var(--surface-2);color:var(--fg);border:1px solid var(--line-strong);border-radius:8px;padding:8px;resize:vertical}
.wishcard .wl{margin:0}.wishcard .muted{color:var(--faint)}.wo-t{color:var(--danger)}.ww-t{color:var(--ok)}
@media (hover:none) and (pointer:coarse){textarea{font-size:16px!important}}
.legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}

h2{font-family:var(--font-display);font-size:18px;margin:0 0 10px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{background:var(--surface-2);color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tbl tfoot td,.tbl tfoot th{font-weight:700;background:var(--surface-2);border-bottom:0}
.tbl tr.grp td{background:var(--surface-2);font-weight:600;text-align:left}
.tbl tr.sub td{font-weight:600;background:var(--surface-2)}
.tbl tr.all td{font-weight:700;font-size:15px;background:var(--surface-2);border-bottom:0}
.tbl .pay{font-weight:700}
.tbl .gdot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--brand);margin-right:8px}
.tbl input{width:104px;height:32px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:9px;height:9px;border-radius:3px;background:var(--brand)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld input{height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px;color:var(--fg);font-size:14px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.staff{display:flex;flex-direction:column;gap:6px}
.staff-row{display:flex;gap:6px}
.staff-row input{flex:1;height:34px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);padding:0 10px;min-width:0}
button.mini{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);white-space:nowrap}
button.mini:hover{background:var(--hover);color:var(--fg)}
button.mini.danger{border-color:var(--danger);color:var(--danger)}
.notice{padding:10px 14px;border-radius:10px;background:var(--help-bg);color:var(--on-help);font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px);z-index:50}
#toast[hidden]{display:none}
.loading .grid-wrap{opacity:.55}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.mini{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.imp{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
@media (hover:none) and (pointer:coarse){input,select,textarea{font-size:16px!important}}
@media (max-width:600px){
  .ident h1{font-size:22px} .mlabel{min-width:120px;font-size:16px}
  .stat{flex:1;min-width:100px;padding:8px 12px} .stat .sv{font-size:20px}
}
@media (prefers-reduced-motion:no-preference){
  td.cell,.bb,.tab{transition:background-color .12s}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";

var RU_MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var RU_MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];

function mkStaff(prefix,n){var a=[];for(var i=1;i<=n;i++)a.push({id:prefix+i,name:'Сотрудник '+i});return a;}
var DEFAULT_RULES={levelAdds:[0,50,100],peak:0,referral:3000,loyalty:3000,team:1000,mentor:500,quality:[2000,1500,1000,500],schedReq:true};
var QLABELS=['График без опозданий и пропусков','Ноль недостач и ошибок при выдаче','Нет жалоб, хороший рейтинг пункта','Порядок смены'];
var LEVELS=['До 3 месяцев','3–6 месяцев','Больше 6 месяцев'];
var DEFAULT_CONFIG={v:1,rules:DEFAULT_RULES,pvz:[
  {id:'ozon1',title:'Ozon ПВЗ №1',brand:'ozon',rate:5000,helpEnabled:false,helpRate:200,itemPay:1,staff:mkStaff('o1s',2)},
  {id:'ozon2',title:'Ozon ПВЗ №2',brand:'ozon',rate:5000,helpEnabled:false,helpRate:200,itemPay:1,staff:mkStaff('o2s',2)},
  {id:'ozon3',title:'Ozon ПВЗ №3',brand:'ozon',rate:5000,helpEnabled:false,helpRate:200,itemPay:1,staff:mkStaff('o3s',2)},
  {id:'wb1',title:'Wildberries ПВЗ',brand:'wb',rate:5000,helpEnabled:false,helpRate:200,itemPay:1,staff:mkStaff('w1s',2)}
]};

var now=new Date();
var S={
  config:clone(DEFAULT_CONFIG),
  months:{},
  loaded:{config:false,months:{}},
  tab:'ozon1',
  y:now.getFullYear(), m:now.getMonth(),
  brush:'shift', hours:4,
  readOnly:false, status:'loading', fresh:false, confirmRm:null, imp:null
};
var DB=null, USER=null, DL=null, INITIAL=null;
var staffMap={};

function clone(o){return JSON.parse(JSON.stringify(o));}
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(v,d){var n=Number(String(v).replace(',','.'));return isFinite(n)&&String(v).trim()!==''?n:d;}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function monthKey(){return S.y+'-'+String(S.m+1).padStart(2,'0');}
function daysIn(){return new Date(S.y,S.m+1,0).getDate();}
function monthLabel(){return RU_MONTHS[S.m]+' '+S.y;}
function fmtH(h){return (Math.round(h*100)/100).toString().replace('.',',');}
function fmtMoney(n){return Math.round(n).toLocaleString('ru-RU').replace('-','−');}
function isToday(d){var t=new Date();return t.getFullYear()===S.y&&t.getMonth()===S.m&&t.getDate()===d;}
function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- data normalisation ---------- */
function nn(v){var n=Number(v);return isFinite(n)&&n>0?n:0;}
function normRules(r){
  var d=clone(DEFAULT_RULES); if(!r||typeof r!=='object')return d;
  ['peak','referral','loyalty','team','mentor'].forEach(function(k){if(r[k]!==undefined&&isFinite(Number(r[k]))&&Number(r[k])>=0)d[k]=Number(r[k]);});
  if(Array.isArray(r.levelAdds))for(var i=0;i<3;i++)if(isFinite(Number(r.levelAdds[i]))&&Number(r.levelAdds[i])>=0)d.levelAdds[i]=Number(r.levelAdds[i]);
  if(Array.isArray(r.quality))for(var j=0;j<4;j++)if(isFinite(Number(r.quality[j]))&&Number(r.quality[j])>=0)d.quality[j]=Number(r.quality[j]);
  if(typeof r.schedReq==='boolean')d.schedReq=r.schedReq;
  d.levelAdds[0]=0;
  return d;
}
function normConfig(d){
  if(!d||!Array.isArray(d.pvz)||!d.pvz.length)return clone(DEFAULT_CONFIG);
  return {v:1,rules:normRules(d.rules),pvz:d.pvz.map(function(p){
    return {id:String(p.id),title:String(p.title||''),brand:p.brand==='wb'?'wb':'ozon',
      rate:num(p.rate,0),helpEnabled:!!p.helpEnabled,helpRate:num(p.helpRate,200),itemPay:p.itemPay===undefined?1:nn(p.itemPay),
      staff:(Array.isArray(p.staff)?p.staff:[]).map(function(s){var lv=Number(s.level);return {id:String(s.id),name:String(s.name||''),level:lv>=1&&lv<=2?Math.floor(lv):0};})};
  })};
}
function emptyMonth(){return {v:1,cells:{},adj:{},adv:{},rates:{},wish:{},bonus:{},rules:null};}
function normMonth(d){
  var m=emptyMonth(); if(!d)return m;
  var c=clone(d);
  m.cells=c.cells&&typeof c.cells==='object'?c.cells:{};
  m.adj=c.adj&&typeof c.adj==='object'?c.adj:{};
  m.adv=c.adv&&typeof c.adv==='object'?c.adv:{};
  m.rates=c.rates&&typeof c.rates==='object'?c.rates:{};
  m.wish=c.wish&&typeof c.wish==='object'?c.wish:{};
  m.bonus=c.bonus&&typeof c.bonus==='object'?c.bonus:{};
  m.rules=c.rules&&typeof c.rules==='object'?normRules(c.rules):null;
  return m;
}
function rebuildStaffMap(){
  staffMap={};
  S.config.pvz.forEach(function(p){p.staff.forEach(function(st){staffMap[st.id]={p:p,st:st};});});
  if(S.tab!=='total'&&S.tab!=='settings'&&!S.config.pvz.some(function(p){return p.id===S.tab;}))S.tab=S.config.pvz[0].id;
}
function getMonth(key){key=key||monthKey();return S.months[key]||(S.months[key]=emptyMonth());}
function rates(p,key){
  var r=getMonth(key).rates[p.id];
  return {rate:r&&isFinite(r.rate)?Number(r.rate):p.rate, helpRate:r&&isFinite(r.helpRate)?Number(r.helpRate):p.helpRate,
    itemPay:r&&r.itemPay!==undefined&&isFinite(r.itemPay)?Number(r.itemPay):(p.itemPay===undefined?1:p.itemPay)};
}
function rulesFor(key){var md=getMonth(key);return md.rules||S.config.rules;}
function levelOf(st,md){var b=md.bonus[st.id];var v=b&&b.level!==undefined?Number(b.level):(st.level||0);return v>=1&&v<=2?Math.floor(v):0;}
function bonusOf(md,sid){
  var b=md.bonus[sid]||{}, q=[];
  for(var i=0;i<4;i++)q.push(!!(b.q&&b.q[i]));
  return {items:nn(b.items),peak:nn(b.peak),refs:nn(b.refs),train:Math.min(4,nn(b.train)),mentor:nn(b.mentor),loy:!!b.loy,team:!!b.team,sched:b.sched!==false,q:q};
}
function ensureRates(key){
  var md=getMonth(key);
  S.config.pvz.forEach(function(p){
    var r=md.rates[p.id];
    if(!r)md.rates[p.id]={rate:p.rate,helpRate:p.helpRate,itemPay:p.itemPay};
    else if(r.itemPay===undefined)r.itemPay=p.itemPay;
  });
  if(!md.rules)md.rules=clone(S.config.rules);
  S.config.pvz.forEach(function(p){p.staff.forEach(function(st){
    var b=md.bonus[st.id]||(md.bonus[st.id]={});
    if(b.level===undefined)b.level=st.level||0;
  });});
}
function calc(p,st,key){
  var md=getMonth(key), c=md.cells[st.id]||{}, n=new Date(S.y,S.m+1,0).getDate(), shifts=0, hrs=0;
  Object.keys(c).forEach(function(k){
    if(Number(k)>n)return;
    if(c[k]==='s')shifts++; else if(typeof c[k]==='number'&&p.helpEnabled)hrs+=c[k];
  });
  var r=rates(p,key), R=rulesFor(key), hr=r.helpRate, adj=Number(md.adj[st.id])||0, adv=Number(md.adv[st.id])||0;
  var b=bonusOf(md,st.id), lv=levelOf(st,md), lvlAdd=R.levelAdds[lv]||0;
  var volume=shifts>0?Math.round(b.items*r.itemPay):0;
  var qp=0;for(var i=0;i<4;i++)if(b.q[i])qp+=R.quality[i];
  var quality=shifts>0&&(!R.schedReq||b.sched)?qp:0;
  var peak=Math.min(b.peak,shifts)*R.peak, referral=b.refs*R.referral, loyalty=b.loy?R.loyalty:0, team=b.team?R.team:0, mentor=b.mentor*R.mentor;
  var bonus=quality+peak+referral+loyalty+team+mentor;
  var training=Math.round(b.train*r.rate);
  var total=Math.round(shifts*(r.rate+lvlAdd)+hrs*hr+volume+bonus+adj);
  return {shifts:shifts,hrs:hrs,payShifts:Math.round(shifts*(r.rate+lvlAdd)),payHours:Math.round(hrs*hr),adj:adj,
    volume:volume,bonus:bonus,quality:quality,qualityPossible:qp,peak:peak,referral:referral,loyalty:loyalty,team:team,mentor:mentor,
    training:training,level:lv,lvlAdd:lvlAdd,items:b.items,
    total:total,adv:adv,rest:total-adv,rate:r.rate,hourRate:hr};
}

var pend={config:false,months:{}}, infl={config:false,m:null}, timer=null, flushing=false;
function markDirty(kind,key){
  if(kind==='config')pend.config=true;
  else{key=key||monthKey();ensureRates(key);pend.months[key]=true;}
  setStatus('saving');
  clearTimeout(timer);timer=setTimeout(flush,600);
}
function busyConfig(){return pend.config||infl.config;}
function busyMonth(k){return !!pend.months[k]||infl.m===k;}
async function saveConfig(){
  var data=clone(S.config);
  if(DB)await DB.doc('app/config').set(data); else lsSet('pvz:config',data);
}
async function saveMonth(k){
  var md=getMonth(k), data={v:1,cells:clone(md.cells),adj:clone(md.adj),adv:clone(md.adv),rates:clone(md.rates),wish:clone(md.wish||{}),bonus:clone(md.bonus||{}),rules:md.rules?clone(md.rules):null};
  if(DB)await DB.doc('months/'+k).set(data); else lsSet('pvz:month:'+k,data);
}
async function flush(){
  if(flushing)return; flushing=true; var err=null;
  try{
    while(pend.config||Object.keys(pend.months).length){
      if(pend.config){
        pend.config=false;infl.config=true;
        try{await saveConfig();}catch(e){pend.config=true;throw e;}finally{infl.config=false;}
      }
      var ks=Object.keys(pend.months);
      if(ks.length){
        var k=ks[0];delete pend.months[k];infl.m=k;
        try{await saveMonth(k);}catch(e){pend.months[k]=true;throw e;}finally{infl.m=null;}
      }
    }
  }catch(e){err=e||{};}
  flushing=false;
  if(err){
    if(err.code==='invalid_argument'||err.code==='revoked'){pend.config=false;pend.months={};setStatus('denied');return;}
    setStatus('error');clearTimeout(timer);timer=setTimeout(flush,4000);return;
  }
  if(!pend.config&&!Object.keys(pend.months).length)setStatus(DB?'saved':'local');
}

function applyWishes(){
  var ta=document.getElementById('wishin');if(!ta||S.readOnly)return;

  function days(t){var seen={};return t.split(',').map(Number).filter(function(x){if(!x||x<1||x>n||seen[x])return false;seen[x]=1;return true;}).sort(function(a,b){return a-b;});}
  while((m=re.exec(ta.value))){
    found++;

function readImport(file){

      var keys=Object.keys(d.months).filter(function(k){return /^\d{4}-\d{2}$/.test(k);}).sort(), sel={};
      keys.forEach(function(k){sel[k]=true;});

    renderView();
  };

async function saveFile(name,data,type){

  var blob=new Blob([data],{type:type||'application/octet-stream'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;

}
async function exportData(){

    if(DB){var snap=await DB.collection('months').get();snap.docs.forEach(function(d){months[d.id]=normMonth(d.data());});}
    else{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('pvz:month:')===0)months[k.slice(10)]=normMonth(lsGet(k));}}
  }catch(e){}
  Object.keys(S.months).forEach(function(k){if(S.loaded.months[k])months[k]=S.months[k];});
  Object.keys(months).forEach(function(k){

    if(!Object.keys(m.cells).length&&!Object.keys(m.adj).length&&!Object.keys(m.adv).length&&!hasB)delete months[k];

function refreshStats(){

  var mk=monthKey(), n=daysIn(), v={};

  var G={oz:zero(),all:zero()};
  function put(id,t){
    v['psh|'+id]=t.sh;v['phr|'+id]=fmtH(t.hr);v['pps|'+id]=fmtMoney(t.ps);v['pph|'+id]=fmtMoney(t.ph);
    v['padj|'+id]=fmtMoney(t.adj);v['pvol|'+id]=fmtMoney(t.vol);v['pbon|'+id]=fmtMoney(t.bon);v['pbv|'+id]=fmtMoney(t.vol+t.bon);v['ptrn|'+id]=fmtMoney(t.trn);v['ptot|'+id]=fmtMoney(t.tot);v['padv|'+id]=fmtMoney(t.adv);v['prest|'+id]=fmtMoney(t.rest);
  }
  S.config.pvz.forEach(function(p){
    var t=zero(), cov=[];

    p.staff.forEach(function(st){
      var c=calc(p,st,mk);
      v['nm|'+st.id]=st.name;v['sh|'+st.id]=c.shifts;v['hr|'+st.id]=fmtH(c.hrs);v['ps|'+st.id]=fmtMoney(c.payShifts);
      v['ph|'+st.id]=fmtMoney(c.payHours);v['vol|'+st.id]=fmtMoney(c.volume);v['bon|'+st.id]=fmtMoney(c.bonus);v['bv|'+st.id]=fmtMoney(c.volume+c.bonus);v['trn|'+st.id]=fmtMoney(c.training);v['tot|'+st.id]=fmtMoney(c.total);v['rest|'+st.id]=fmtMoney(c.rest);
      t.sh+=c.shifts;t.hr+=c.hrs;t.ps+=c.payShifts;t.ph+=c.payHours;t.adj+=c.adj;t.tot+=c.total;t.adv+=c.adv;t.rest+=c.rest;t.vol+=c.volume;t.bon+=c.bonus;t.trn+=c.training;
      var cells=getMonth(mk).cells[st.id]||{};
      for(var d2=1;d2<=n;d2++)if(cells[d2]==='s')cov[d2]++;
    });

function decideMode(td){

function paintCell(td,mode){
  var sid=td.dataset.s, d=td.dataset.d, md=getMonth(), cells=md.cells[sid]||(md.cells[sid]={}), cur=cells[d], nv;
  if(mode==='erase')nv=null;else{nv=brushValue();if(nv===undefined)return false;}
  if(nv===null&&cur===undefined)return false;

}

}
function startDrag(td){
  if(!canPaint())return;
  var mode=decideMode(td);if(!mode)return;
  drag={mode:mode,last:td,table:td.closest('table'),changed:false};
  applyPaint(td);
  document.addEventListener('pointermove',onMove);
  document.addEventListener('pointerup',endDrag,{once:true});
  document.addEventListener('pointercancel',endDrag,{once:true});
}
function onMove(e){
  if(!drag)return;
  var el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest?el.closest('td.cell'):null;
  if(!c||c===drag.last||!drag.table.contains(c))return;
  if(c.dataset.s===drag.last.dataset.s){
    var a=Number(drag.last.dataset.d), b=Number(c.dataset.d), step=b>a?1:-1;
    for(var d=a+step;d!==b+step;d+=step){
      var mid=drag.table.querySelector('td.cell[data-s="'+c.dataset.s+'"][data-d="'+d+'"]');
      if(mid)applyPaint(mid);
    }
  }else applyPaint(c);
  drag.last=c;
}
function endDrag(){
  document.removeEventListener('pointermove',onMove);
  drag=null;
}
function singlePaint(td){
  if(!canPaint())return;
  var mode=decideMode(td);if(!mode)return;

  if(t.dataset.rulesched!==undefined&&!S.readOnly){
    var mk5=monthKey();ensureRates(mk5);getMonth(mk5).rules.schedReq=!!t.checked;S.config.rules.schedReq=!!t.checked;
    markDirty('config');markDirty('month',mk5);refreshStats();renderView();return;
  }
  if(t.id==='impfile'){if(t.files&&t.files[0])readImport(t.files[0]);t.value='';return;}
  if(t.dataset.impm!==undefined&&S.imp){S.imp.sel[t.dataset.impm]=!!t.checked;return;}
  if(t.dataset.impcfg!==undefined&&S.imp){S.imp.cfg=!!t.checked;return;}
  if(t.dataset.set==='title'){renderView();}
  else if(t.dataset.helpon!==undefined&&!S.readOnly){
    var p=S.config.pvz.filter(function(x){return x.id===t.dataset.helpon;})[0];if(!p)return;
    p.helpEnabled=!!t.checked;markDirty('config');renderView();
  }
});

/* ---------- Excel export ---------- */
function sheetName(raw,used){
  var base=String(raw||'Лист').replace(/[\[\]:*?\/\\]/g,'').trim().slice(0,28)||'Лист', nm=base, i=2;
  while(used[nm.toLowerCase()]){nm=base+' '+i++;}
  used[nm.toLowerCase()]=true;return nm;
}
function put(ws,addr,v,f){ws[addr]=f?{t:'n',f:f,v:v}:{t:typeof v==='number'?'n':'s',v:v};}
async function exportXlsx(){
  if(!canExport()){toast('Выгрузка в Excel здесь недоступна');return;}
  var mk=monthKey(), n=daysIn(), md=getMonth(mk), wb=XLSX.utils.book_new(), used={}, refs=[], E=XLSX.utils.encode_col;
  S.config.pvz.forEach(function(p){
    var r=rates(p,mk), hourRate=r.helpRate, first=8, last=first+p.staff.length-1, tot=last+1;
    var cS=2+n, cH=3+n, cL=4+n, cI=5+n, cB=6+n, cA=7+n, cZ=8+n, cT=9+n, name=sheetName(p.title,used);
    var ws={};
    put(ws,'A1',p.title);put(ws,'E1','Отметки: С — смена, число — часы подработки');
    put(ws,'A2','Месяц');put(ws,'B2',monthLabel());
    put(ws,'A3','Ставка за смену');put(ws,'B3',r.rate);
    put(ws,'A4','Ставка за час подработки');put(ws,'B4',hourRate);
    put(ws,'A5','Подработка по часам');put(ws,'B5',p.helpEnabled?'да':'нет');
    put(ws,'A6','За заказ сверх нормы');put(ws,'B6',r.itemPay);
    put(ws,'A7','№');put(ws,'B7','Сотрудник');
    for(var d=1;d<=n;d++)put(ws,E(1+d)+'7',d);
    put(ws,E(cS)+'7','Смен');put(ws,E(cH)+'7','Подработка, ч');put(ws,E(cL)+'7','Надбавка за стаж, ₽/смена');put(ws,E(cI)+'7','Заказов сверх нормы');
    put(ws,E(cB)+'7','Бонусы, ₽');put(ws,E(cA)+'7','Доплата / штраф');put(ws,E(cZ)+'7','Зарплата');put(ws,E(cT)+'7','Стажировка (в 3-ю зарплату), ₽');
    var sums={sh:0,hr:0,it:0,bon:0,adj:0,pay:0,trn:0};
    p.staff.forEach(function(st,i){
      var rr=first+i, c=calc(p,st,mk), cells=md.cells[st.id]||{};
      put(ws,'A'+rr,i+1);put(ws,'B'+rr,st.name);
      for(var d2=1;d2<=n;d2++){var v=cells[d2];if(v==='s')put(ws,E(1+d2)+rr,'С');else if(typeof v==='number'&&p.helpEnabled)put(ws,E(1+d2)+rr,v);}
      var rng=E(2)+rr+':'+E(1+n)+rr;
      put(ws,E(cS)+rr,c.shifts,'COUNTIF('+rng+',"С")');
      put(ws,E(cH)+rr,c.hrs,'SUM('+rng+')');
      put(ws,E(cL)+rr,c.lvlAdd);
      put(ws,E(cI)+rr,c.items);
      put(ws,E(cB)+rr,c.bonus);
      put(ws,E(cA)+rr,c.adj);
      put(ws,E(cZ)+rr,c.total,'ROUND('+E(cS)+rr+'*($B$3+'+E(cL)+rr+')+'+E(cH)+rr+'*$B$4+IF('+E(cS)+rr+'>0,ROUND('+E(cI)+rr+'*$B$6,0),0)+'+E(cB)+rr+'+'+E(cA)+rr+',0)');
      put(ws,E(cT)+rr,c.training);
      sums.sh+=c.shifts;sums.hr+=c.hrs;sums.it+=c.items;sums.bon+=c.bonus;sums.adj+=c.adj;sums.pay+=c.total;sums.trn+=c.training;
    });
    put(ws,'B'+tot,'Итого по пункту');
    [[cS,sums.sh],[cH,sums.hr],[cI,sums.it],[cB,sums.bon],[cA,sums.adj],[cZ,sums.pay],[cT,sums.trn]].forEach(function(x){
      put(ws,E(x[0])+tot,x[1],'SUM('+E(x[0])+first+':'+E(x[0])+last+')');
    });
    ws['!ref']='A1:'+E(cT)+tot;
    ws['!cols']=[{wch:22},{wch:22}].concat(Array.apply(null,Array(n)).map(function(){return {wch:4.5};})).concat([{wch:8},{wch:13},{wch:14},{wch:14},{wch:12},{wch:16},{wch:12},{wch:18}]);
    XLSX.utils.book_append_sheet(wb,ws,name);
    refs.push({p:p,name:name,first:first,cS:cS,cH:cH,cL:cL,cI:cI,cB:cB,cA:cA,cZ:cZ,cT:cT});
  });
  var ws2={}, row=4, T={sh:0,hr:0,bv:0,adj:0,pay:0,adv:0,rest:0,trn:0};
  put(ws2,'A1','Итоги');put(ws2,'B1',monthLabel());
  ['Пункт','Сотрудник','Смен','Подработка, ч','Бонусы и сверх нормы','Доплата / штраф','Начислено','Аванс','Остаток к выплате','Стажировка (в 3-ю зарплату)'].forEach(function(h,i){put(ws2,E(i)+'3',h);});
  var firstRow=row;
  refs.forEach(function(rf){
    rf.p.staff.forEach(function(st,i){
      var c=calc(rf.p,st,mk), q="'"+rf.name.replace(/'/g,"''")+"'!", rr=rf.first+i;
      put(ws2,'A'+row,rf.p.title);put(ws2,'B'+row,st.name);
      put(ws2,'C'+row,c.shifts,q+E(rf.cS)+rr);put(ws2,'D'+row,c.hrs,q+E(rf.cH)+rr);
      put(ws2,'E'+row,c.volume+c.bonus,'IF('+q+E(rf.cS)+rr+'>0,ROUND('+q+E(rf.cI)+rr+'*'+q+'$B$6,0),0)+'+q+E(rf.cB)+rr);
      put(ws2,'F'+row,c.adj,q+E(rf.cA)+rr);put(ws2,'G'+row,c.total,q+E(rf.cZ)+rr);
      put(ws2,'H'+row,c.adv);put(ws2,'I'+row,c.rest,'G'+row+'-H'+row);put(ws2,'J'+row,c.training,q+E(rf.cT)+rr);
      T.sh+=c.shifts;T.hr+=c.hrs;T.bv+=c.volume+c.bonus;T.adj+=c.adj;T.pay+=c.total;T.adv+=c.adv;T.rest+=c.rest;T.trn+=c.training;row++;
    });
  });
  put(ws2,'A'+row,'ВСЕГО');
  [['C',T.sh],['D',T.hr],['E',T.bv],['F',T.adj],['G',T.pay],['H',T.adv],['I',T.rest],['J',T.trn]].forEach(function(x){
    put(ws2,x[0]+row,x[1],'SUM('+x[0]+firstRow+':'+x[0]+(row-1)+')');
  });
  ws2['!ref']='A1:J'+row;ws2['!cols']=[{wch:22},{wch:22},{wch:8},{wch:14},{wch:20},{wch:16},{wch:12},{wch:10},{wch:18},{wch:24}];
  XLSX.utils.book_append_sheet(wb,ws2,sheetName('Итого',used));
  var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  try{
    var res=await saveFile('Смены_ПВЗ_'+mk+'.xlsx',out);
    if(res&&res.status==='saved')toast('Файл сохранён');
  }catch(err){
    if(err&&err.code==='declined')return;
    toast('Не удалось сохранить файл');
  }
}

/* ---------- storage wiring ---------- */
function onFresh(snap){
  if(snap.metadata&&!snap.metadata.fromCache){
    S.fresh=true;clearTimeout(loadTimer);
    if(S.status==='loading'||S.status==='offline')setStatus(S.readOnly?'ro':'saved');
  }
}
function subscribeConfig(){
  DB.doc('app/config').onSnapshot(function(snap){
    if(!snap.metadata.hasPendingWrites&&!busyConfig()){
      if(snap.exists){
        var nc=normConfig(snap.data());
        if(JSON.stringify(nc)!==JSON.stringify(S.config)){S.config=nc;rebuildStaffMap();render();}
      }
      S.loaded.config=true;
    }
    onFresh(snap);
  },function(){setStatus('offline');});
}
function subscribeMonth(){
  if(unsubMonth){unsubMonth();unsubMonth=null;}
  var key=monthKey();
  if(!DB){
    if(!S.loaded.months[key]){S.months[key]=normMonth(lsGet('pvz:month:'+key));S.loaded.months[key]=true;}
    return;
  }
  unsubMonth=DB.doc('months/'+key).onSnapshot(function(snap){
    if(!snap.metadata.hasPendingWrites&&!busyMonth(key)){
      var nm=snap.exists?normMonth(snap.data()):emptyMonth();
      var changed=!S.loaded.months[key]||JSON.stringify(nm)!==JSON.stringify(S.months[key]);
      S.months[key]=nm;S.loaded.months[key]=true;
      if(changed&&key===monthKey()){
        if(!document.activeElement||document.activeElement.tagName!=='INPUT'||!$('#app').contains(document.activeElement))render();
        else renderLater=true;
      }
    }
    onFresh(snap);
  },function(){setStatus('offline');});
}
async function init(){
  rebuildStaffMap();render();
  async function use(name){try{return window.claude&&window.claude.use?await window.claude.use(name):null;}catch(e){return null;}}
  var r=await Promise.all([use('db'),use('user'),use('downloads')]);
  DB=r[0];USER=r[1];DL=r[2];
  try{if(DB&&USER&&typeof USER.canEdit==='function'&&(await USER.canEdit())===false)S.readOnly=true;}catch(e){}
  if(!DB){
    if(INITIAL&&!lsGet('pvz:seeded')){
      lsSet('pvz:config',INITIAL.config);
      Object.keys(INITIAL.months||{}).forEach(function(k){lsSet('pvz:month:'+k,INITIAL.months[k]);});
      lsSet('pvz:seeded',1);
    }
    S.config=normConfig(lsGet('pvz:config'));rebuildStaffMap();S.loaded.config=true;
    subscribeMonth();setStatus('local');render();return;
  }
  setStatus(S.readOnly?'ro':'loading');
  loadTimer=setTimeout(function(){if(!S.fresh)setStatus('offline');},10000);
  subscribeConfig();subscribeMonth();
  render();
}
init();
})();
</script>
